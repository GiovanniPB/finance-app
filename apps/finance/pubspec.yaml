name: finance
description: App de finanças pessoais (offline-first, mobile + desktop first).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # Pacotes internos do workspace.
  core:
    path: ../../packages/core
  database:
    path: ../../packages/database
  design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter
  # Traduções dos widgets do Material (seletor de data, tooltips padrão). Vem do
  # SDK, não é pacote de terceiro.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  powersync: ^2.3.3
  riverpod_annotation: ^4.0.3
  sqlite_async: ^0.14.3
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  sqlite3: ^3.4.0

flutter:
  uses-material-design: true

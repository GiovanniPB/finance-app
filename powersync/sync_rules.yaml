# =========================================================================
# PowerSync Sync Rules — define o que cada cliente baixa para o SQLite local.
# Ver ADR 0004: acesso por membership de espaço. Dois grupos de buckets:
#
#  • user_owned — o que é "meu" independentemente de espaço (perfil, contas do
#    dono). Parâmetro vem do JWT do Supabase (request.user_id()).
#  • by_space   — tudo com escopo de espaço, por membership. O parameter query
#    lê space_members para derivar um bucket por espaço ativo do usuário
#    (padrão canônico many-to-many do PowerSync).
#
# Espelha o RLS do Postgres. Após editar, publique no PowerSync (Dashboard ou
# CLI `powersync`) e valide. Novas tabelas com escopo de espaço entram na lista
# `by_space.data` conforme forem criadas (transactions, categories, budgets…).
# =========================================================================
bucket_definitions:
  # Bucket global (sem parameters): dado idêntico para todo mundo. As categorias
  # de sistema (space_id nulo) são as "fixas prontas" do RN-1.2 e não pertencem
  # a espaço nenhum, então precisam de um bucket fora do by_space.
  global:
    data:
      - select * from categories where space_id is null

  user_owned:
    parameters: select request.user_id() as user_id
    data:
      - select * from profiles where id = bucket.user_id
      - select * from accounts where owner_id = bucket.user_id
      # Conexão de Open Finance é do dono, não do espaço: o consentimento é
      # pessoal (ver o cabeçalho da migration 20260728033219). Por isso mora
      # aqui e não em `by_space`.
      #
      # `webhook_events` **não** aparece em bucket nenhum, de propósito: é
      # registro de operação do servidor, não dado do usuário.
      - select * from open_finance_connections where owner_id = bucket.user_id

  by_space:
    # Um bucket por espaço em que o usuário é membro ativo.
    parameters: >-
      select space_id from space_members
      where user_id = request.user_id() and status = 'active'
    data:
      - select * from spaces where id = bucket.space_id
      - select * from space_members where space_id = bucket.space_id
      - select * from accounts where linked_space_id = bucket.space_id
      - select * from categories where space_id = bucket.space_id
      - select * from transactions where space_id = bucket.space_id
      - select * from budgets where space_id = bucket.space_id
      - select * from savings_goals where space_id = bucket.space_id
      # `savings_contributions.space_id` é denormalizado justamente para caber
      # aqui: sync rule não faz join, então a contribuição precisa carregar o
      # próprio espaço. No Postgres um trigger o mantém igual ao da meta.
      - select * from savings_contributions where space_id = bucket.space_id
      # `expense_splits.space_id`, idem — e agora com a regra escrita no ADR
      # 0011: dado alcançável só por join viaja na linha. A parte aponta para o
      # lançamento, que sabe o espaço; a sync rule não tem como seguir esse
      # caminho, então a coluna carrega o espaço e um trigger a mantém.
      - select * from expense_splits where space_id = bucket.space_id

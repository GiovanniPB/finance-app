name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  verify:
    name: Format · Analyze · Test · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace (pub get)
        run: flutter pub get

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Code generation
        run: dart pub global run melos run gen --no-select

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart pub global run melos run analyze --no-select

      - name: Test (with coverage)
        run: dart pub global run melos run coverage --no-select

      # As regras puras das Edge Functions. Node executa TypeScript direto e o
      # módulo não importa nada, então isto não custa Deno nem Docker — e é o
      # único gate que cobre a direção do lançamento importado, que já foi
      # gravada errada duas vezes.
      - name: Test (regras da ingestão)
        run: node --test 'supabase/functions/_shared/*.test.ts'

      - name: Coverage gate (>= 80%)
        run: bash tool/check_coverage.sh 80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/lcov.info"
          if-no-files-found: ignore

  integration:
    name: Integração (PowerSync local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace (pub get)
        run: flutter pub get

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Code generation
        run: dart pub global run melos run gen --no-select

      # Abre um PowerSyncDatabase de verdade num diretório temporário. Não
      # precisa de device nem de rede: o SDK traz a extensão nativa por
      # plataforma, e os testes usam o binding comum do flutter_test. Fica em
      # job separado porque é a única parte do CI que depende de biblioteca
      # nativa — quando quebrar, quebra sozinho.
      - name: Testes de integração
        run: dart pub global run melos run integration --no-select

  build-smoke:
    name: Build smoke (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace (pub get)
        run: flutter pub get

      - name: Activate Melos
        run: dart pub global activate melos

      # Arquivos gerados (*.g.dart, *.freezed.dart) não são versionados;
      # é preciso gerá-los antes de compilar.
      - name: Code generation
        run: dart pub global run melos run gen --no-select

      - name: Build web (dev entrypoint)
        working-directory: apps/finance
        run: flutter build web --target lib/main_dev.dart

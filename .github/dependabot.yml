version: 2
updates:
  # Dependências Dart/Flutter. Com Pub Workspaces, a resolução ocorre só na
  # raiz do workspace — o Dependabot deve apontar para "/" (não por pacote).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Actions do GitHub.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

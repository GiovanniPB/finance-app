name: design_system
description: >-
  Sistema de design compartilhado: tokens, tema (claro/escuro) e widgets base.
  Scaffold nesta fase — sem telas de feature.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  # Money é o value object de dinheiro (ADR 0006). O design system depende dele
  # para que MoneyText seja o único lugar que decide cor/sinal de um valor.
  core:
    path: ../core
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
